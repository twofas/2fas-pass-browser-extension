<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=400, height=600, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <title>2FAS Pass Browser Extension</title>
    <meta name="color-scheme" content="dark light">
    <meta name="google" content="notranslate">
    <style>
      html, body, #root { background-color: #161616; margin: 0; min-height: 600px; min-width: 400px; padding: 0; }
      html:not(.theme-light) *, html:not(.theme-dark) *, body:not(.loaded) * { visibility: hidden; }
      html.theme-light *, html.theme-dark *, body.loaded * { visibility: visible; }
      * { box-sizing: border-box; }
    </style>
  </head>
  <body>
    <!-- Off-screen autofocus warmer: on Safari, the HTML autofocus attribute
         is honored during HTML parse and claims initial focus before the
         popover settles. React's autoFocus on the search input then transfers
         focus from this warmer to the real input. -->
    <input id="popup-focus-warmer" autofocus tabindex="-1" aria-hidden="true" readonly style="position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;border:0;margin:0;padding:0;visibility:visible">
    <div id="root"></div>
    <div id="select-menu-portal" class="select-portal-hidden" style="position: fixed; z-index: 9999;"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
