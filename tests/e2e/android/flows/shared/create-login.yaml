# Reusable subflow — create a Login item, starting from the unlocked HOME screen.
# Fully parameterized so it can create ANY login, not just the John/Doe example.
#
# Params (env):
#   NAME      item name/label (REQUIRED by the app — Save is a no-op while empty)
#   USERNAME  the username
#   PASSWORD  the password (the form pre-fills a generated one; we overwrite it)
#   URI       a URL to attach (the URL field only appears after "+  Add URL")
#   TIER      security tier: "Secret" | "Highly Secret" | "Top Secret"
#
# Pre-conditions: app unlocked, on the tabbed home (Items/Connect/Settings).
# Post-condition: back on the items list, with NAME asserted visible (creation proof).
#
# Every selector was grounded in the live `maestro hierarchy` of the 1.8.0 Add-Login UI.
appId: com.twofasapp.pass
env:
  NAME: "google.com"
  USERNAME: "John"
  PASSWORD: "Doe"
  URI: "google.com"
  TIER: "Secret"
---
# Home → add-item FAB (icon-only, no text / no content-desc; bottom-right ≈ 89%,84%).
- assertVisible: "Connect"
- tapOn:
    point: "89%,84%"

# "Add Item" bottom sheet (Login / Card / Secure Note / Wi-Fi).
- assertVisible: "Add Item"
- tapOn: "Login"
- assertVisible: "Add Login"

# Name (REQUIRED).
- tapOn: "Name"
- inputText: "${NAME}"
- hideKeyboard

# Username.
- tapOn: "Username"
- inputText: "${USERNAME}"
- hideKeyboard

# Password — the field is PRE-FILLED with a generated password. A plain tapOn+eraseText
# leaves a suffix (Maestro eraseText backspaces from the cursor — issue #1777), so we
# long-press the field (by point — stable at ~50%,34% with the keyboard down, before the
# URL row exists) → "Select all" → overwrite with the exact value.
- longPressOn:
    point: "50%,34%"
- assertVisible: "Select all"
- tapOn: "Select all"
- inputText: "${PASSWORD}"
- hideKeyboard

# URI — no URL field exists until "+  Add URL" is tapped.
- tapOn: "+  Add URL"
- assertVisible: "URL"
- tapOn: "URL"
- inputText: "${URI}"
- hideKeyboard

# Security tier — the "Security Tier" row opens the "Choose Security Tier" sheet with
# options Secret / Highly Secret / Top Secret. Anchor the match with ^...$ because a
# bare "Secret" substring-matches "Highly Secret"/"Top Secret" and the descriptions.
- tapOn: "Security Tier"
- assertVisible: "Choose Security Tier"
- tapOn:
    text: "^${TIER}$"
- assertVisible:
    text: "^${TIER}$"

# Save → back on the items list; NAME visible proves the item was created.
- tapOn: "Save"
- assertVisible: "${NAME}"
