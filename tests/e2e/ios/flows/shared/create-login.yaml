# Reusable subflow — create a Login item, starting from the unlocked HOME screen.
# Fully parameterized so it can create ANY login, not just the John/Doe example.
#
# Params (env):
#   NAME      item name/label (REQUIRED by the app — "Done" stays disabled while empty)
#   USERNAME  the username
#   PASSWORD  the password (the form pre-fills a generated one; we erase + overwrite it)
#   URI       a URL to attach (the URL field only appears after the "+  Add URL" row)
#   TIER      security tier: "Secret" | "Highly Secret" | "Top Secret"
#
# Pre-conditions: app unlocked, on the tabbed home (Items/Connect/Settings).
# Post-condition: back on the items list, with the item row asserted visible (creation proof).
#
# iOS specifics, all grounded in the live `maestro hierarchy` of this build:
#   * Text fields are tapped by POINT on the input area (right of the label); tapping the label
#     text does not focus the field.
#   * The Password field is PRE-FILLED with a generated value — eraseText clears it cleanly on
#     iOS (no Android #1777 suffix), then we type the exact value.
#   * The keyboard is "sticky": to surface the rows below the fold (Add URL / Security Tier) we
#     SCROLL the form up (a swipe). Selecting a Security Tier auto-dismisses the keyboard.
#   * The "+  Add URL" label has two spaces, which breaks text matching, so it is tapped by point.
#   * Order matters: we set the Security Tier BEFORE the URL, because selecting a tier returns to
#     the form with the keyboard DOWN, which makes the "+  Add URL" row reliably tappable.
#   * GOTCHA — the iOS QuickType keyboard raises a system "Save Password?" keychain prompt when a
#     password field loses focus. It can appear at unpredictable moments and OVERLAYS the app, so
#     we defensively dismiss it ("Not Now") right before every screen we assert on.
appId: com.twofas.org.TwoPASS.dev
env:
  NAME: "google.com"
  USERNAME: "John"
  PASSWORD: "Doe"
  URI: "google.com"
  TIER: "Secret"
---
# Home → add (+) → Login.
- tapOn: "add"
- tapOn: "Login"
- assertVisible: "Add Login, Actions Menu"

# Name (REQUIRED) — input area right of the label.
- tapOn:
    point: "61%,34%"
- inputText: "${NAME}"

# Username.
- tapOn:
    point: "61%,40%"
- inputText: "${USERNAME}"

# Password — PRE-FILLED; erase then overwrite with the exact value.
- tapOn:
    point: "61%,46%"
- eraseText: 50
- inputText: "${PASSWORD}"

# Scroll the form up so the "Security Tier" row clears the (still-open) keyboard. This blurs the
# password field, which may trigger the "Save Password?" keychain prompt — dismiss it if shown.
- swipe:
    start: "50%,40%"
    end: "50%,20%"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

# Open the "Choose Security Tier" picker via its combined-label cell and pick the requested tier.
# The bare "Secret" string substring-matches "Highly Secret"/"Top Secret", so anchor it ^...$.
- tapOn: "Security Tier, Secret"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- assertVisible: "Choose Security Tier"
- tapOn:
    text: "^${TIER}$"
# Back on the form, now with the keyboard DOWN and the tier confirmed.
- assertVisible: "Add Login, Actions Menu"
- assertVisible: "Security Tier, ${TIER}"

# URL — the field only appears after the "+  Add URL" row (tapped by point; keyboard is down so
# the row is unobstructed). After the tap, the URL field sits at the same point.
- tapOn:
    point: "50%,42%"
- assertVisible: "URL"
- tapOn:
    point: "50%,42%"
- inputText: "${URI}"

# Save via the top-right "Done" check (enabled once Name + Password are set). A system
# "Save Password?" keychain prompt may interpose — dismiss it if shown, then re-tap Done.
- tapOn: "Done"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
      - tapOn: "Done"

# Back on the items list; the row "NAME, USERNAME" proves the item was created. Dismiss a late
# keychain prompt if one is still lingering over the list.
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- assertVisible: "${NAME}, ${USERNAME}"
